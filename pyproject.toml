[project]
name = "mnemo-unified-context"
version = "0.1.0a17"
description = "Local-first durable checkpoint and dbt lineage context for coding agents"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Mnemo contributors" }]
maintainers = [{ name = "Mnemo contributors" }]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
dependencies = [
    "fastapi==0.139.2",
    "mcp==1.28.1",
    "tree-sitter==0.25.2",
    "tree-sitter-c==0.24.2",
    "tree-sitter-c-sharp==0.23.5",
    "tree-sitter-cpp==0.23.4",
    "tree-sitter-go==0.25.0",
    "tree-sitter-javascript==0.25.0",
    "tree-sitter-java==0.23.5",
    "tree-sitter-php==0.24.1",
    "tree-sitter-rust==0.24.2",
    "tree-sitter-typescript==0.23.2",
    "typer==0.27.0",
    "uvicorn==0.47.0",
]

[project.scripts]
mnemo = "mnemo_memory.cli:main"
mnemo-memory = "mnemo_memory.cli:main"
mnemo-memory-team = "mnemo_memory.apps.mcp.team_runtime:main"
mnemo-memory-team-admin = "mnemo_memory.apps.cli.team_admin:main"

[project.urls]
Homepage = "https://github.com/keith-fajardo/mnemo-memory"
Repository = "https://github.com/keith-fajardo/mnemo-memory"
Issues = "https://github.com/keith-fajardo/mnemo-memory/issues"
Documentation = "https://github.com/keith-fajardo/mnemo-memory#readme"

[project.optional-dependencies]
# This extra runs embeddings on the local machine.  It is deliberately not installed by default:
# model weights are fetched only after an explicit local semantic-index action.
semantic = [
    "fastembed==0.8.0",
]
# This extra is used only by the explicitly enabled shadow planner. Ordinary hooks load verified
# local files and never acquire model weights from the network.
router = [
    "huggingface-hub==1.26.0",
    "model2vec==0.7.0",
]
# Team PostgreSQL support is optional so personal SQLite installs do not acquire a database driver.
team = [
    "pg8000==1.31.5",
    "pyjwt==2.13.0",
]

[dependency-groups]
dev = [
    "mypy==1.20.2",
    "pg8000==1.31.5",
    "pytest==8.4.2",
    "ruff==0.14.14",
]

[build-system]
requires = ["uv_build>=0.9.7,<0.10"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "mnemo_memory"
namespace = true
source-include = ["deploy/team/**"]

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers", "-ra"]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
explicit_package_bases = true
namespace_packages = true
mypy_path = ["src"]
files = ["src/mnemo_memory", "tests", "scripts"]
pretty = true
show_error_codes = true
warn_unreachable = true

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["docs/implementation-plan.md", "mnemo-unified-memory-codex-implementation-plan.md"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP"]

[tool.ruff.format]
docstring-code-format = true
