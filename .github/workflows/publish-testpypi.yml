name: Publish TestPyPI

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: testpypi-mnemo-unified-context-0.1.0a18
  cancel-in-progress: false

jobs:
  build-and-verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Check out the triggering commit
        # actions/checkout v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}

      - name: Install Python 3.12
        # actions/setup-python v5.6.0
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install pinned uv
        # astral-sh/setup-uv v8.1.0
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.9.7"

      - name: Verify ref and release metadata
        run: |
          test "${{ github.ref }}" = refs/heads/main
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          test -z "$(git status --porcelain)"
          uv run python - <<'PY'
          import tomllib
          project = tomllib.load(open("pyproject.toml", "rb"))["project"]
          assert project["name"] == "mnemo-unified-context"
          assert project["version"] == "0.1.0a18"
          PY
          uv run python scripts/verify_release_artifacts.py \
            --source-root . \
            --text-path pyproject.toml \
            --text-path README.md \
            --text-path docs \
            --forbidden-text mnemo-agent-context-placeholder

      - name: Install verification dependencies
        run: |
          uv sync --locked
          npm ci --ignore-scripts

      - name: Install pgvector build prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes build-essential clang-19 postgresql-server-dev-16

      - name: Build pinned pgvector extension
        shell: bash
        run: |
          git clone --depth 1 --branch v0.8.5 https://github.com/pgvector/pgvector.git "$RUNNER_TEMP/pgvector"
          test "$(git -C "$RUNNER_TEMP/pgvector" rev-parse HEAD)" = "159b79aaad5983fb7459c1e3df2897fbb2d11788"
          make -C "$RUNNER_TEMP/pgvector"
          sudo make -C "$RUNNER_TEMP/pgvector" install

      - name: Run repository verification and deterministic evaluations
        env:
          MNEMO_VERIFY_INSTALLED_ALLOW_NETWORK: "1"
        run: |
          npm run check
          npm run eval:resumption -- --json
          npm run eval:cross-client -- --json
          npm run eval:unified-context -- --json

      - name: Build and inspect source-independent artifacts
        run: |
          set -euxo pipefail
          wheel="mnemo_unified_context-0.1.0a18-py3-none-any.whl"
          sdist="mnemo_unified_context-0.1.0a18.tar.gz"
          fail() { echo "::error::$1"; exit 1; }
          require_file() { test -f "$1" || fail "required file is missing: $1"; }

          mkdir build-output release
          uv build --no-sources --out-dir build-output
          require_file "build-output/$wheel"
          require_file "build-output/$sdist"
          cp "build-output/$wheel" "build-output/$sdist" release/
          python scripts/verify_release_artifacts.py \
            --wheel "build-output/$wheel" \
            --sdist "build-output/$sdist"

          (cd release && sha256sum "$wheel" "$sdist" > SHA256SUMS)
          test "$(find release -type f | wc -l | tr -d ' ')" = 3 || fail "release must contain exactly three regular files"
          test "$(find release -mindepth 1 -maxdepth 1 -type f | wc -l | tr -d ' ')" = 3 || fail "release files must use a flat layout"
          test "$(find release -mindepth 1 -type d | wc -l | tr -d ' ')" = 0 || fail "release must not contain subdirectories"
          require_file "release/$wheel"
          require_file "release/$sdist"
          require_file release/SHA256SUMS
          test ! -e release/.gitignore || fail "uv build metadata must not enter release"
          printf '%s\n' "Final staged release files:"
          find release -maxdepth 1 -type f -print | sort

      - name: Smoke-test exact wheel and source distribution
        run: |
          for artifact in release/*.whl release/*.tar.gz; do
            work="$(mktemp -d)"
            uv venv "$work/venv" --python 3.12
            uv pip install --python "$work/venv/bin/python" "$artifact"
            (cd "$work" && "$work/venv/bin/mnemo-memory" --help)
            (cd "$work" && "$work/venv/bin/mnemo-memory" init --data-dir "$work/Mnemo Data Δ")
            python scripts/verify_installed_dbt_wrapper.py \
              --command "$work/venv/bin/mnemo-memory" \
              --work-directory "$work/dbt wrapper smoke" \
              --manifest "$(pwd)/tests/fixtures/dbt/manifest-v12.json"
            "$work/venv/bin/python" - <<'PY'
          import mnemo_memory
          from importlib import resources
          assert "site-packages" in str(mnemo_memory.__file__)
          assert resources.files("mnemo_memory").joinpath("resources/migrations/0003_dbt_manifest_snapshots.sql").is_file()
          assert resources.files("mnemo_memory").joinpath("resources/schemas/context-packet-v1.json").is_file()
          PY
          done

      - name: Upload immutable release bundle
        # actions/upload-artifact v4.6.2
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mnemo-unified-context-0.1.0a18
          path: release/
          if-no-files-found: error
          retention-days: 3

  publish-testpypi:
    needs: build-and-verify
    runs-on: ubuntu-latest
    environment: testpypi
    timeout-minutes: 10
    permissions:
      id-token: write

    steps:
      - name: Download exact release bundle
        # actions/download-artifact v4.3.0
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: mnemo-unified-context-0.1.0a18
          path: release

      - name: Verify bundle and OIDC availability
        run: |
          test -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}"
          test -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}"
          test "$(find release -type f | wc -l | tr -d ' ')" = 3
          test "$(find release -mindepth 1 -maxdepth 1 -type f | wc -l | tr -d ' ')" = 3
          test "$(find release -mindepth 1 -type d | wc -l | tr -d ' ')" = 0
          test -f release/SHA256SUMS
          (cd release && sha256sum --check SHA256SUMS)
          test -f release/mnemo_unified_context-0.1.0a18-py3-none-any.whl
          test -f release/mnemo_unified_context-0.1.0a18.tar.gz
          mkdir publish-release
          cp release/mnemo_unified_context-0.1.0a18-py3-none-any.whl publish-release/
          cp release/mnemo_unified_context-0.1.0a18.tar.gz publish-release/
          test "$(find publish-release -type f | wc -l | tr -d ' ')" = 2

      - name: Sign and publish only exact verified artifacts through TestPyPI OIDC
        # pypa/gh-action-pypi-publish v1.14.0
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b
        with:
          packages-dir: publish-release/
          repository-url: https://test.pypi.org/legacy/
          attestations: true

  verify-testpypi:
    needs: publish-testpypi
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Check out the triggering commit
        # actions/checkout v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}

      - name: Install Python 3.12
        # actions/setup-python v5.6.0
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install pinned uv
        # astral-sh/setup-uv v8.1.0
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.9.7"

      - name: Download checksum bundle
        # actions/download-artifact v4.3.0
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: mnemo-unified-context-0.1.0a18
          path: release

      - name: Verify TestPyPI metadata, hashes, and uploaded wheel
        run: |
          set -euxo pipefail
          test "$(find release -type f | wc -l | tr -d ' ')" = 3
          test "$(find release -mindepth 1 -maxdepth 1 -type f | wc -l | tr -d ' ')" = 3
          test "$(find release -mindepth 1 -type d | wc -l | tr -d ' ')" = 0
          test -f release/SHA256SUMS
          test -f release/mnemo_unified_context-0.1.0a18-py3-none-any.whl
          test -f release/mnemo_unified_context-0.1.0a18.tar.gz
          (cd release && sha256sum --check SHA256SUMS)
          python scripts/verify_testpypi_release.py \
            --provenance-base-url https://test.pypi.org/integrity \
            --expected-repository keith-fajardo/mnemo-memory \
            --expected-workflow publish-testpypi.yml \
            --release-dir release \
            --download-dir downloaded-release \
            --request-timeout-seconds 10 \
            --deadline-seconds 120 \
            --retry-interval-seconds 3
          work="$(mktemp -d)"
          uv venv "$work/venv" --python 3.12
          uv pip install --python "$work/venv/bin/python" --index-url https://pypi.org/simple/ \
            downloaded-release/mnemo_unified_context-0.1.0a18-py3-none-any.whl
          (cd "$work" && "$work/venv/bin/mnemo-memory" --help)
          (cd "$work" && "$work/venv/bin/mnemo-memory" init --data-dir "$work/Mnemo Data Δ")
          "$work/venv/bin/python" - <<'PY'
          from importlib import resources
          assert resources.files("mnemo_memory").joinpath("resources/migrations/0003_dbt_manifest_snapshots.sql").is_file()
          assert resources.files("mnemo_memory").joinpath("resources/schemas/context-packet-v1.json").is_file()
          PY
