name: Publish to TestPyPI

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact package version to publish (for example, 0.1.0a1)
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Build, verify, and publish TestPyPI artifact
    runs-on: ubuntu-latest
    environment: testpypi
    timeout-minutes: 20

    steps:
      - name: Check out the approved ref
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Install Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.7"

      - name: Verify requested version
        run: |
          test "$(uv run python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')" = "${{ inputs.version }}"

      - name: Build source-independent artifacts
        run: uv build --no-sources --out-dir dist

      - name: Verify artifact contents and hashes
        run: |
          uv run python scripts/verify_installed_mcp.py --help
          shasum -a 256 dist/*

      - name: Publish exact verified artifacts through Trusted Publishing
        run: uv publish --publish-url https://test.pypi.org/legacy/ dist/*
