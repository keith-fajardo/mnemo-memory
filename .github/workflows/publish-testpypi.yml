name: Publish TestPyPI

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: testpypi-mnemo-unified-context-0.1.0a1
  cancel-in-progress: false

jobs:
  publish:
    name: Build, verify, and publish exact artifacts
    runs-on: ubuntu-latest
    environment: testpypi
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out the triggering commit
        # actions/checkout v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}

      - name: Install Python 3.12
        # actions/setup-python v5.6.0
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install pinned uv
        run: python -m pip install --disable-pip-version-check "uv==0.9.7"

      - name: Verify release metadata and clean checkout
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          test -z "$(git status --porcelain)"
          uv run python - <<'PY'
          import tomllib
          project = tomllib.load(open("pyproject.toml", "rb"))["project"]
          assert project["name"] == "mnemo-unified-context"
          assert project["version"] == "0.1.0a1"
          PY
          ! rg -n "mnemo-agent-context-placeholder" pyproject.toml docs README.md

      - name: Install verification dependencies
        run: |
          uv sync --locked
          npm ci --ignore-scripts

      - name: Run complete repository gate
        run: npm run check

      - name: Run deterministic evaluations
        run: |
          npm run eval:resumption -- --json
          npm run eval:cross-client -- --json
          npm run eval:unified-context -- --json

      - name: Build source-independent artifacts once
        run: uv build --no-sources --out-dir dist

      - name: Inspect and validate artifact set
        run: |
          test "$(find dist -maxdepth 1 -type f | wc -l | tr -d ' ')" = 2
          test -f dist/mnemo_unified_context-0.1.0a1-py3-none-any.whl
          test -f dist/mnemo_unified_context-0.1.0a1.tar.gz
          unzip -l dist/*.whl | rg 'mnemo_memory/(py.typed|resources/migrations/0003_dbt_manifest_snapshots.sql|resources/schemas/context-packet-v1.json)'
          tar -tzf dist/*.tar.gz | rg 'src/mnemo_memory/resources/(migrations/0003_dbt_manifest_snapshots.sql|schemas/context-packet-v1.json)'
          ! unzip -l dist/*.whl | rg '\.(sqlite|db|env|pem|key)$|manifest\.json'
          sha256sum dist/* | tee dist/SHA256SUMS

      - name: Smoke-test exact wheel and source distribution
        run: |
          for artifact in dist/*.whl dist/*.tar.gz; do
            work="$(mktemp -d)"
            uv venv "$work/venv" --python 3.12
            uv pip install --python "$work/venv/bin/python" "$artifact"
            (cd "$work" && "$work/venv/bin/mnemo-memory" --help)
            (cd "$work" && "$work/venv/bin/mnemo-memory" init --data-dir "$work/Mnemo Data Δ")
            "$work/venv/bin/python" - <<'PY'
          import mnemo_memory
          from importlib import resources
          assert "site-packages" in str(mnemo_memory.__file__)
          assert resources.files("mnemo_memory").joinpath("resources/migrations/0003_dbt_manifest_snapshots.sql").is_file()
          assert resources.files("mnemo_memory").joinpath("resources/schemas/context-packet-v1.json").is_file()
          PY
          done

      - name: Require OIDC before TestPyPI publication
        run: |
          test -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}"
          test -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}"

      - name: Publish exact verified artifacts to TestPyPI with OIDC
        env:
          UV_PUBLISH_URL: https://test.pypi.org/legacy/
          UV_PUBLISH_TRUSTED_PUBLISHING: always
        run: uv publish dist/*

      - name: Verify TestPyPI upload and install uploaded wheel
        run: |
          curl --fail --retry 5 --retry-delay 3 -o metadata.json https://test.pypi.org/pypi/mnemo-unified-context/0.1.0a1/json
          uv run python - <<'PY'
          import hashlib, json
          from pathlib import Path
          data = json.load(open("metadata.json"))
          expected = {path.name: hashlib.sha256(path.read_bytes()).hexdigest() for path in Path("dist").iterdir() if path.name != "SHA256SUMS"}
          uploaded = {item["filename"]: item["digests"]["sha256"] for item in data["urls"]}
          assert uploaded == expected, (uploaded, expected)
          PY
          work="$(mktemp -d)"
          uv venv "$work/venv" --python 3.12
          uv pip install --python "$work/venv/bin/python" --index-url https://test.pypi.org/simple/ --extra-index-url https://pypi.org/simple/ mnemo-unified-context==0.1.0a1
          (cd "$work" && "$work/venv/bin/mnemo-memory" --help)
          (cd "$work" && "$work/venv/bin/mnemo-memory" init --data-dir "$work/Mnemo Data Δ")
