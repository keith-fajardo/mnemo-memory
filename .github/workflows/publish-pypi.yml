name: Publish PyPI

on:
  workflow_dispatch:
    inputs:
      source-run-id:
        description: Successful TestPyPI build run containing the verified release bundle
        required: true
        default: "30761127604"

permissions: {}

concurrency:
  group: pypi-mnemo-unified-context-0.1.0a1
  cancel-in-progress: false

jobs:
  verify-release-bundle:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read

    steps:
      - name: Download exact TestPyPI-verified release bundle
        # actions/download-artifact v4.3.0
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: mnemo-unified-context-0.1.0a1
          path: release
          repository: keith-fajardo/mnemo-memory
          run-id: ${{ inputs.source-run-id }}
          github-token: ${{ github.token }}

      - name: Verify exact release bundle
        run: |
          set -euxo pipefail
          test "$(find release -type f | wc -l | tr -d ' ')" = 3
          test "$(find release -mindepth 1 -maxdepth 1 -type f | wc -l | tr -d ' ')" = 3
          test "$(find release -mindepth 1 -type d | wc -l | tr -d ' ')" = 0
          test -f release/SHA256SUMS
          test -f release/mnemo_unified_context-0.1.0a1-py3-none-any.whl
          test -f release/mnemo_unified_context-0.1.0a1.tar.gz
          (cd release && sha256sum --check SHA256SUMS)

  publish-pypi:
    needs: verify-release-bundle
    runs-on: ubuntu-latest
    environment: pypi
    timeout-minutes: 10
    permissions:
      actions: read
      id-token: write

    steps:
      - name: Install Python 3.12
        # actions/setup-python v5.6.0
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install pinned uv
        # astral-sh/setup-uv v8.1.0
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.9.7"

      - name: Download exact verified release bundle
        # actions/download-artifact v4.3.0
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: mnemo-unified-context-0.1.0a1
          path: release
          repository: keith-fajardo/mnemo-memory
          run-id: ${{ inputs.source-run-id }}
          github-token: ${{ github.token }}

      - name: Verify bundle and OIDC availability
        run: |
          test -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}"
          test -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}"
          test -f release/SHA256SUMS
          (cd release && sha256sum --check SHA256SUMS)
          test -f release/mnemo_unified_context-0.1.0a1-py3-none-any.whl
          test -f release/mnemo_unified_context-0.1.0a1.tar.gz

      - name: Publish only exact verified artifacts through PyPI OIDC
        run: |
          uv publish \
            --trusted-publishing always \
            --publish-url https://upload.pypi.org/legacy/ \
            release/mnemo_unified_context-0.1.0a1-py3-none-any.whl \
            release/mnemo_unified_context-0.1.0a1.tar.gz
