name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Format, lint, type check, and test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.2

      - name: Install Python
        uses: actions/setup-python@v6.2.0
        with:
          # Test the supported CPython minor line. macos-latest may not retain every older patch
          # build, including the repository's local development pin.
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
          version: "0.9.7"

      - name: Install Node.js
        uses: actions/setup-node@v6.3.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install Python dependencies
        run: uv sync --locked

      - name: Install TypeScript dependencies
        run: npm ci --ignore-scripts

      - name: Install pgvector build prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes postgresql-server-dev-all

      - name: Build pinned pgvector extension
        shell: bash
        run: |
          git clone --depth 1 --branch v0.8.5 https://github.com/pgvector/pgvector.git "$RUNNER_TEMP/pgvector"
          test "$(git -C "$RUNNER_TEMP/pgvector" rev-parse HEAD)" = "159b79aaad5983fb7459c1e3df2897fbb2d11788"
          make -C "$RUNNER_TEMP/pgvector"
          sudo make -C "$RUNNER_TEMP/pgvector" install

      - name: Run quality gate
        run: npm run check
